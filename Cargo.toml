[package]
name = "chatbot_ui"
version = "0.1.0"
edition = "2024"
description = "Standalone egui UI for the chatbot application"
license = "0BSD"
readme = "README.md"

[dependencies]
egui = "0.29"
eframe = "0.29"
chrono = { version = "0.4", features = ["serde"] }
the-markdown-commons = { path = "../the-markdown-commons", features = ["egui"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
egui_extras = "0.29"

[lib]
path = "src/lib.rs"
